<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantéConnect - Inscription Médecin</title>
    <script src="demo-api.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Inscription Médecin</h3>
                    <form action="register-medecin.php" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" placeholder="Prénom" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" placeholder="Nom" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Spécialité (ex: Généraliste, Cardiologue)</label>
                            <input type="text" name="specialite" class="form-control" placeholder="Spécialité" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Professionnel</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" name="password" class="form-control" minlength="8" required>
                            <div class="form-text">8 caractères minimum.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Créer mon compte professionnel</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a href="index-medecin.html" class="text-decoration-none small">Déjà inscrit ? Se connecter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
