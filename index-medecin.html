<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantéConnect - Espace Praticien</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .login-container { max-width: 400px; margin-top: 100px; }
        .card { border-top: 5px solid #198754; } /* Petite barre verte pour différencier */
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Connexion Médecin</h3>
            
            <form action="login-medecin.php" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Professionnel</label>
                    <input type="email" name="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100">Accéder au Cabinet Médical</button>
            </form>
            
            <div class="mt-3 text-center">
                <p class="small mb-1">Pas encore de compte professionnel ?</p>
                <a href="register-medecin.html" class="btn btn-outline-success btn-sm w-100">Créer un compte médecin</a>
            </div>

            <hr>
            <div class="text-center">
                <a href="index.html" class="small text-decoration-none text-muted">← Retour à l'accès Patient</a>
            </div>
        </div>
    </div>
    
    <p class="text-center mt-4 text-muted small">Espace réservé au personnel soignant<br>Prototype pédagogique – non conforme HDS</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    if (new URLSearchParams(location.search).get('success') === 'compte_active') {
        alert('Compte activé ! Vous pouvez vous connecter.');
    }
</script>
</body>
</html>
